profile:
  name: "Yu Liu (刘毓)"
  position: "ELLIS PhD Student &middot; CMVS, University of Oulu &amp; ELLIS Institute Finland"
  avatar: "/images/yultheconkor_avatar.png"
  paragraphs:
    - >-
      I am an ELLIS PhD student jointly affiliated with the
      <a href="https://www.oulu.fi/en/university/faculties-and-units/faculty-information-technology-and-electrical-engineering/center-for-machine-vision-and-signal-analysis">Center for Machine Vision and Signal Analysis (CMVS)</a>,
      <a href="https://www.oulu.fi/en">University of Oulu</a>, and the
      <a href="https://www.ellisinstitute.fi/">ELLIS Institute Finland</a>. I am supervised by
      <a href="https://gyzhao-nm.github.io/Guoying/">Prof. Guoying Zhao</a>, and co-supervised by
      <a href="https://www.cs.helsinki.fi/u/ahonkela/">Prof. Antti Honkela</a> at the ELLIS Institute Finland
      and <a href="http://www.schuller.one/">Prof. Bj&ouml;rn Schuller</a> within the ELLIS PhD Program.
      I received my M.S. in Artificial Intelligence from the
      <a href="http://hias.ucas.ac.cn/">Hangzhou Institute for Advanced Study</a>,
      <a href="https://www.ucas.edu.cn/">University of Chinese Academy of Sciences</a>, in 2026,
      supervised by <a href="https://people.ucas.ac.cn/~0070909">Prof. Taihao Li</a> and
      <a href="https://people.ucas.edu.cn/~leyuanqu">Dr. Leyuan Qu</a>.
    - >-
      My research mainly focuses on <strong>privacy-aware multimodal affect understanding</strong>
      with <strong>multimodal large language models</strong>, tracing every affective interpretation
      back to the audio, video and text evidence it rests on. If you are interested in collaborating,
      feel free to reach out via email.
  links:
