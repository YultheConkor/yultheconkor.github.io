research:
  - title: "Multimodal Affective Computing"
    text: >-
      From frame-level facial dynamics to conversation-level tracking and open-vocabulary
      emotional reasoning, following a Perception &rarr; Dialogue Understanding &rarr; Expression pipeline.
  - title: "Human-aware Multimodal Agents"
    text: >-
      Cross-modal alignment, long-horizon memory and reasoning, multi-agent coordination,
      and safe embodied interaction for agents that stay coherent over time.
  - title: "Digital Therapeutics"
    text: >-
      Mental-health screening under privacy and low-resource constraints, combining visual
      biomarkers with LLM-augmented questionnaire semantics.

publications:
  note: "* equal contribution"
  items:
    - title: "Follow the Clues, Frame the Truth: Hybrid-evidential Deductive Reasoning in Open-Vocabulary Multimodal Emotion Recognition"
      badges:
        - text: "Under Review"
      authors: "<strong>Yu Liu</strong>, Lei Zhang, Haoxun Li, Hanlei Shi, Yuxuan Ding, Leyuan Qu, Taihao Li"
      summary: >-
        Formalizes emotion inference as a Propose&ndash;Verify&ndash;Decide protocol and uses reinforcement
        learning with hierarchical reward shaping to internalize abductive reasoning, producing
        interpretable evidence traces while outperforming strong baselines.
      links:
        - label: arXiv
          url: "https://arxiv.org/abs/2603.16463"

    - title: "Centering Emotion Hotspots: Multimodal Local-Global Fusion and Cross-Modal Alignment for Emotion Recognition in Conversations"
      badges:
        - text: "Under Review"
      authors: "<strong>Yu Liu</strong>, Hanlei Shi, Haoxun Li, Yuqing Sun, Yuxuan Ding, Linlin Gong, Leyuan Qu, Taihao Li"
      summary: >-
        Extends frame-level recognition to conversation-level tracking by centering multimodal
        hotspots and fusing them with dialogue context, improving stability and generalization across turns.
      links:
        - label: arXiv
          url: "https://arxiv.org/abs/2510.08606"

    - title: "From Coarse to Nuanced: Cross-Modal Alignment of Fine-Grained Linguistic Cues and Visual Salient Regions for Dynamic Emotion Recognition"
      badges:
        - text: "IEEE TAFFC"
        - text: "Under Review"
          soft: true
      authors: "<strong>Yu Liu</strong>, Leyuan Qu, Hanlei Shi, Di Gao, Yuhua Zheng, Taihao Li"
      summary: >-
        Introduces GRACE for dynamic facial emotion recognition by aligning refined linguistic cues
        with salient facial dynamics, achieving state of the art on DFEW, FERV39k and MAFW.
      links:
        - label: arXiv
          url: "https://arxiv.org/abs/2507.11892"

    - title: "HOPE: Hierarchical Fusion for Optimized and Personality-Aware Estimation of Depression"
      badges:
        - text: "ACM MM'25"
        - text: "1st Place · MPDD"
          soft: true
      authors: "Hanlei Shi*, <strong>Yu Liu*</strong>, Haoxun Li, Yuqing Sun, Yuxuan Ding, Linlin Gong, Leyuan Qu, Taihao Li"
      summary: >-
        Subject-level depression detection under privacy constraints via hierarchical audio&ndash;video
        fusion with personalized textual cues and cross-task consistency.
      links:
        - label: Paper
          url: "https://doi.org/10.1145/3746027.3762063"

    - title: "Think-Before-Draw: Decomposing Emotion Semantics & Fine-Grained Controllable Expressive Talking Head Generation"
      badges:
        - text: "Pattern Recognition"
      authors: "Hanlei Shi, Leyuan Qu, <strong>Yu Liu</strong>, Di Gao, Yuhua Zheng, Taihao Li"
      summary: >-
        A two-stage framework for disentangled, controllable talking-head synthesis; I designed the
        multimodal fusion module that preserves identity while sharpening affect control.
      links:
        - label: Paper
          url: "https://www.sciencedirect.com/science/article/abs/pii/S0031320326005595"
        - label: arXiv
          url: "https://arxiv.org/abs/2507.12761"

    - title: "Flight Operation Risk Propagation Based on Complex Network"
      badges:
        - text: "J. Transp. Sys. Eng."
        - text: "F5000 Top Article"
          soft: true
      authors: "<strong>Yu Liu</strong>, et al."
      summary: >-
        Brings Spearman correlation and SIR dynamics into airline operational risk management,
        yielding a deployable complex-network propagation analysis.
      links:
        - label: Paper
          url: "http://www.tseit.org.cn/CN/Y2020/V20/I1/198"

